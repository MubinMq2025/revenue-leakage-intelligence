# Model checks for the star schema (sql/models/).
# Every check is a SQL query that returns ONE number called "failures".
#
# severity:
#   error -> must be 0, otherwise the run fails (the model is broken)
#   warn  -> a known business gap we expect to see; "expect" is the number we
#            already know about. A different number means something changed.

checks:
  # --- 1. Row counts: models keep exactly the rows of their source ----------
  - name: fact_order_items_rows_match_source
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM fact_order_items) - (SELECT COUNT(*) FROM order_items)) AS failures

  - name: fact_payments_rows_match_source
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM fact_payments) - (SELECT COUNT(*) FROM payments)) AS failures

  - name: fact_orders_rows_match_source
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM fact_orders) - (SELECT COUNT(*) FROM orders)) AS failures

  - name: dim_product_rows_match_source
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM dim_product) - (SELECT COUNT(*) FROM products)) AS failures

  - name: dim_seller_rows_match_source
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM dim_seller) - (SELECT COUNT(*) FROM sellers)) AS failures

  - name: dim_customer_rows_match_unique_customers
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM dim_customer) - (SELECT COUNT(DISTINCT customer_unique_id) FROM customers)) AS failures

  # --- 2. Unique keys: no key appears twice -----------------------------------
  - name: dim_customer_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT customer_key FROM dim_customer GROUP BY customer_key HAVING COUNT(*) > 1) AS dupes

  - name: dim_product_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT product_id FROM dim_product GROUP BY product_id HAVING COUNT(*) > 1) AS dupes

  - name: dim_seller_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT seller_id FROM dim_seller GROUP BY seller_id HAVING COUNT(*) > 1) AS dupes

  - name: dim_date_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT date_key FROM dim_date GROUP BY date_key HAVING COUNT(*) > 1) AS dupes

  - name: fact_orders_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT order_id FROM fact_orders GROUP BY order_id HAVING COUNT(*) > 1) AS dupes

  - name: fact_order_items_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT order_id, order_item_id FROM fact_order_items GROUP BY order_id, order_item_id HAVING COUNT(*) > 1) AS dupes

  - name: fact_payments_key_unique
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT order_id, payment_sequential FROM fact_payments GROUP BY order_id, payment_sequential HAVING COUNT(*) > 1) AS dupes

  # --- 3. Orphans: every key in a fact points to a real row -----------------
  - name: items_point_to_an_order
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_order_items f LEFT JOIN fact_orders o ON o.order_id = f.order_id WHERE o.order_id IS NULL

  - name: items_point_to_a_product
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_order_items f LEFT JOIN dim_product p ON p.product_id = f.product_id WHERE p.product_id IS NULL

  - name: items_point_to_a_seller
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_order_items f LEFT JOIN dim_seller s ON s.seller_id = f.seller_id WHERE s.seller_id IS NULL

  - name: payments_point_to_an_order
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_payments f LEFT JOIN fact_orders o ON o.order_id = f.order_id WHERE o.order_id IS NULL

  - name: orders_point_to_a_customer
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_orders f LEFT JOIN dim_customer c ON c.customer_key = f.customer_key WHERE c.customer_key IS NULL

  - name: orders_point_to_a_date
    severity: error
    sql: SELECT COUNT(*) AS failures FROM fact_orders f LEFT JOIN dim_date d ON d.date_key = f.purchase_date_key WHERE d.date_key IS NULL

  # --- 4. Known business gaps (input for Phase 3 reconciliation) ------------
  - name: orders_without_items
    severity: warn
    expect: 775
    sql: SELECT COUNT(*) AS failures FROM fact_orders o WHERE NOT EXISTS (SELECT 1 FROM fact_order_items i WHERE i.order_id = o.order_id)

  - name: orders_without_payment
    severity: warn
    expect: 1
    sql: SELECT COUNT(*) AS failures FROM fact_orders o WHERE NOT EXISTS (SELECT 1 FROM fact_payments p WHERE p.order_id = o.order_id)


  # --- 5. Reconciliation (Phase 3): one code per order, and the money ties out ---
  - name: recon_mart_rows_match_orders
    severity: error
    sql: SELECT abs((SELECT COUNT(*) FROM mart_order_reconciliation) - (SELECT COUNT(*) FROM fact_orders)) AS failures

  - name: recon_mart_one_row_per_order
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT order_id FROM mart_order_reconciliation GROUP BY order_id HAVING COUNT(*) > 1) AS dupes

  - name: recon_every_order_has_a_code
    severity: error
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE reason_code IS NULL OR impact IS NULL

  - name: recon_gap_ties_to_source_in_cents
    severity: error
    sql: SELECT CAST(round(abs((SELECT SUM(gap_amount) FROM mart_order_reconciliation) - ((SELECT SUM(payment_value) FROM payments) - (SELECT SUM(price + freight_value) FROM order_items))) * 100) AS bigint) AS failures

  - name: recon_amount_at_risk_never_negative
    severity: error
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE amount_at_risk < 0

  - name: recon_no_risk_on_ok_or_explained_orders
    severity: error
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE impact IN ('ok', 'explained', 'unconfirmed') AND amount_at_risk <> 0

  - name: summary_at_risk_ties_to_order_mart_within_1_real
    severity: error
    sql: SELECT CASE WHEN abs((SELECT SUM(at_risk_rs) FROM mart_leakage_summary) - (SELECT SUM(amount_at_risk) FROM mart_order_reconciliation)) <= 1 THEN 0 ELSE 1 END AS failures

  - name: summary_paid_ties_to_order_mart_within_1_real
    severity: error
    sql: SELECT CASE WHEN abs((SELECT SUM(paid_rs) FROM mart_leakage_summary) - (SELECT SUM(paid_amount) FROM mart_order_reconciliation)) <= 1 THEN 0 ELSE 1 END AS failures

  # Known reconciliation results: a change means the data or the rules changed
  - name: refund_exposure_orders
    severity: warn
    expect: 1096
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE impact = 'refund_exposure'

  - name: revenue_leakage_orders
    severity: warn
    expect: 40
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE impact = 'revenue_leakage'

  - name: not_approved_orders
    severity: warn
    expect: 143
    sql: SELECT COUNT(*) AS failures FROM mart_order_reconciliation WHERE reason_code = 'NOT_APPROVED'


  # --- ML base table (Phase 4) --------------------------------------------------
  - name: seller_orders_one_row_per_order_seller
    severity: error
    sql: SELECT COUNT(*) AS failures FROM (SELECT order_id, seller_id FROM mart_seller_orders GROUP BY order_id, seller_id HAVING COUNT(*) > 1) AS dupes

  - name: seller_orders_cover_every_order_with_items
    severity: error
    sql: SELECT abs((SELECT COUNT(DISTINCT order_id) FROM mart_seller_orders) - (SELECT COUNT(*) FROM mart_order_reconciliation WHERE item_count > 0)) AS failures

  - name: seller_orders_at_risk_ties_to_order_mart_within_1_real
    severity: error
    sql: SELECT CASE WHEN abs((SELECT SUM(at_risk_rs) FROM mart_seller_orders) - (SELECT SUM(amount_at_risk) FROM mart_order_reconciliation WHERE item_count > 0)) <= 1 THEN 0 ELSE 1 END AS failures

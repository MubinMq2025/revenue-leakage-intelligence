# Settings for the Phase 4 machine learning models.
# Change a number here to change the model; the code reads everything from this file.

seller_features:
  source_table: mart_seller_orders
  first_snapshot: "2017-04-01"   # first month-start we "stand at" and look back from
  last_snapshot: "2018-06-01"    # last one whose 3-month future still fits inside the data (ends Aug 2018)
  window_months: 6               # features look back over 6 months of orders...
  lag_months: 1                  # ...skipping the month just before the snapshot (its outcomes are not settled yet)
  horizon_months: 3              # label: money at risk on the seller's orders over the next 3 months
  smoothing_strength: 20         # how many "average" orders are blended into each seller's rates


seller_risk:
  first_test_snapshot: "2017-10-01"   # earliest month with enough settled history to train the supervised model
  review_queue_size: 20               # sellers the finance team can review each month
  random_state: 42
  log_columns: [orders, revenue_rs, avg_item_price, orders_growth]   # long-tailed numbers, compared on a log scale
  isolation_forest:
    n_estimators: 300
    # behaviour only, not size: otherwise the biggest sellers look "unusual" just for being big
    features: [at_risk_rate, cancel_rate, late_rate, bad_review_rate, avg_review,
               freight_ratio, avg_item_price, orders_growth, tenure_months]
  lightgbm:
    # tweedie suits money targets that are mostly zero with a few large values
    params: {objective: tweedie, tweedie_variance_power: 1.5, n_estimators: 300, learning_rate: 0.03,
             num_leaves: 15, min_child_samples: 20, subsample: 0.8, subsample_freq: 1,
             colsample_bytree: 0.8, verbose: -1}

  # 4.2b: two size-plus-risk ideas, fixed BEFORE looking at the results
  lightgbm_regularized:
    params: {objective: tweedie, tweedie_variance_power: 1.5, n_estimators: 150, learning_rate: 0.05,
             num_leaves: 7, min_child_samples: 50, reg_lambda: 5.0, subsample: 0.8, subsample_freq: 1,
             colsample_bytree: 0.8, verbose: -1}
  selection:
    tuning_end: "2018-03-01"   # pick the winner on Oct 2017 to Feb 2018, then confirm on Mar to Jun 2018 (unseen)



revenue_forecast:
  source_table: mart_order_reconciliation   # paid_amount by purchase date = what customers paid each week
  first_week: "2017-01-02"     # Mondays. 2016 is nearly empty, so it is left out
  last_week: "2018-08-20"      # last complete week (the data stops at the end of August 2018)
  horizons: [1, 2, 3, 4]       # forecast 1 to 4 weeks ahead
  first_origin: "2017-10-02"   # first week we "stand at" and forecast from
  tuning_end: "2018-03-05"     # pick the winner on origins before this, confirm on origins after it (unseen)
  interval_coverage: 0.80      # the low-high range should contain the actual value 80% of the time
  min_past_errors: 8           # past forecast errors needed before we trust an interval
  black_friday_weeks: ["2016-11-21", "2017-11-20"]   # Monday of each Black Friday week
  random_state: 42
  lightgbm:
    params: {objective: regression_l1, n_estimators: 200, learning_rate: 0.05, num_leaves: 7,
             min_child_samples: 5, verbose: -1}

drift:
  # 1. Size and price drift (PSI) on the seller report cards: early period vs latest period
  reference_snapshots: ["2017-04-01", "2017-05-01", "2017-06-01"]
  current_snapshots: ["2018-04-01", "2018-05-01", "2018-06-01"]
  features: [orders, revenue_rs, avg_item_price, freight_ratio]
  psi_bins: 10
  psi_watch: 0.10      # PSI under 0.10 = stable, 0.10 to 0.25 = watch, over 0.25 = drift
  psi_alert: 0.25
  # 2. Behaviour drift: overall rates from the order-level table, same months a year apart.
  #    (Not PSI on the smoothed seller rates: smoothing makes them depend on order counts,
  #    so sellers simply growing would look like a change in behaviour.)
  reference_months: ["2017-04-01", "2017-05-01", "2017-06-01"]
  current_months: ["2018-04-01", "2018-05-01", "2018-06-01"]
  rate_watch: 0.25     # a rate moving by more than 25% of itself = watch
  rate_alert: 0.50     # more than 50% = alert (e.g. cancels going from 1.0% to 1.6%)
  # 3. Performance decay: has the chosen method got much worse lately?
  decay_months: 3            # seller queue: last 3 test months vs first 3
  decay_alert_ratio: 0.5     # alert if recent capture is below half the early capture
  forecast_recent_weeks: 8   # forecast: WAPE of the last 8 weeks vs the whole backtest
  forecast_alert_ratio: 1.5  # alert if recent error is 1.5x the usual error